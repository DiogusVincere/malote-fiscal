name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · Python ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testes unitários (sem Outlook, sem janela)
        run: python -m unittest discover -s tests -v

      - name: Demonstração sem tela (data fixa, resultado determinístico)
        shell: bash
        run: |
          python -m malote.demo --hoje 2026-10-14 --pasta ./demo | tee demo.log
          grep -q "18 e-mails lidos para 09/2026" demo.log
          grep -q "3 · Salvar anexos: 7 arquivo(s)" demo.log
          grep -q "já estava" demo.log
          grep -q "5 · Planilha de controle" demo.log
          test -f "demo/Clientes/101 - PADARIA AURORA LTDA/NFE/2026/09-2026/Tomados/Tomados e-mail/NFSe 1234 - Limpeza Total.pdf"
